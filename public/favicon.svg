<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070B14" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#F97316" stop-opacity="0.5" />
    </linearGradient>

    <!-- Blue Journey (Tech & Services) -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Green Journey (Marketplace, Growth, Woodcraft) -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Orange Journey (Partners, Community) -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="120" ry="120" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Subtle Inner Ambient Mesh -->
  <circle cx="160" cy="180" r="100" fill="#2563EB" opacity="0.12" filter="blur(40px)" />
  <circle cx="350" cy="340" r="110" fill="#16A34A" opacity="0.12" filter="blur(40px)" />

  <!-- Modern Precision W Monogram -->
  <!-- Left Pillar (Tech Blue) -->
  <path d="M 120 160 L 175 160 L 215 320 L 170 320 Z" fill="url(#blueGrad)" />

  <!-- Left Center Beam (Electric Cyan to Blue) -->
  <path d="M 170 320 L 215 320 L 256 200 L 222 200 Z" fill="#38BDF8" opacity="0.95" />

  <!-- Right Center Beam (Growth Green) -->
  <path d="M 256 200 L 290 200 L 332 320 L 288 320 Z" fill="url(#greenGrad)" />

  <!-- Right Pillar (Partner Orange) -->
  <path d="M 288 320 L 332 320 L 392 160 L 338 160 Z" fill="url(#orangeGrad)" />

  <!-- Dynamic Innovation Spark (Top Right) -->
  <path d="M 388 120 Q 388 140 408 140 Q 388 140 388 160 Q 388 140 368 140 Q 388 140 388 120 Z" fill="#38BDF8" filter="url(#glow)" />
</svg>
